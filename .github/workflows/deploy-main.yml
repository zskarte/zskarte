on:
  release:
    types:
      - published

env:
  STAGE: prod
  DOCKERHUB_USERNAME: zskarte
  KUBERNETES_NAMESPACE: zskarte
  APP_NAME: zskarte-server
  IMAGE_TAG: zskarte/zskarte-server
  LETSENCRYPT_STAGE: prod
  DB_HOST: postgresql.postgresql.svc.cluster.local
  DB_PORT: 5432
  DB_NAME: zskarte
  DB_USER: zskarte
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_SSL: "false"
  RUN_MIGRATIONS_ON_BOOT: "true"
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_PROD }}
  BETTER_AUTH_URL: https://api.zskarte.ch
  TRUSTED_ORIGINS: https://zskarte.ch,https://api.zskarte.ch
  PROXY_ALLOWED_HOSTS: "*.geo.admin.ch,geodienste.ch,*.geodienste.ch"
  SIGN_KEY_TYPE: ed25519
  SIGN_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SIGN_PRIVATE_KEY_PASSPHRASE_PROD }}
  SKIP_EXTERNAL_IP: "false"
  STORAGE_PROVIDER: azure
  STORAGE_AZURE_ACCOUNT: zskarte
  STORAGE_AZURE_ACCOUNT_KEY: ${{ secrets.STORAGE_ACCOUNT_KEY }}
  STORAGE_AZURE_SERVICE_BASE_URL: https://zskarte.blob.core.windows.net
  STORAGE_CONTAINER_NAME: zskarte-prod
  MAPLAYER_GENERATION_ENABLED: "false"
  BASE_URL: api.zskarte.ch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Latest Tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1

      - uses: docker/login-action@v3
        name: Login to Docker Hub
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}:${{ steps.previoustag.outputs.tag }}

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Replace and Apply Kubernetes Manifests
        uses: swdotcom/update-and-apply-kubernetes-configs@v1
        with:
          k8-config-file-paths: |
            .azure/k8s/namespace.yml
            .azure/k8s/server-envs.yml
            .azure/k8s/deployment.yml
            .azure/k8s/service.yml
            .azure/k8s/ingress.yml
          replacement-method: defined
        env:
          FULL_IMAGE_NAME: ${{ env.IMAGE_TAG }}:${{ steps.previoustag.outputs.tag }}

  build-and-deploy-app:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      NODE_VERSION: '22.14.0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          action: 'upload'
          app_location: '/' # App source code path
          api_location: '' # Api source code path - optional
          app_build_command: 'npm run build:app'
          output_location: 'packages/app/dist/zskarte/browser' # Built app content directory - optional
          config_file_location: 'packages/app/' # Config file path - optional
          ###### End of Repository/Build Configurations ######
