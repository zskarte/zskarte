on:
  push:
    branches:
      - dev

env:
  STAGE: test
  DOCKERHUB_USERNAME: zskarte
  KUBERNETES_NAMESPACE: zskarte-test
  APP_NAME: zskarte-server
  FULL_IMAGE_NAME: zskarte/zskarte-server:${{ github.sha }}
  LETSENCRYPT_STAGE: prod
  DB_HOST: db.db.svc.cluster.local
  DB_PORT: 5432
  DB_NAME: zskarte-test
  DB_USER: zskarte
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_SSL: "false"
  RUN_MIGRATIONS_ON_BOOT: "true"
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_DEV }}
  BETTER_AUTH_URL: https://api-test.zskarte.ch
  TRUSTED_ORIGINS: https://test.zskarte.ch,https://api-test.zskarte.ch
  PROXY_ALLOWED_HOSTS: "*.geo.admin.ch,geodienste.ch,*.geodienste.ch"
  SIGN_KEY_TYPE: ed25519
  SIGN_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SIGN_PRIVATE_KEY_PASSPHRASE_DEV }}
  SKIP_EXTERNAL_IP: "false"
  STORAGE_PROVIDER: azure
  STORAGE_AZURE_ACCOUNT: zskarte
  STORAGE_AZURE_ACCOUNT_KEY: ${{ secrets.STORAGE_ACCOUNT_KEY }}
  STORAGE_AZURE_SERVICE_BASE_URL: https://zskarte.blob.core.windows.net
  STORAGE_CONTAINER_NAME: zskarte-dev
  MAPLAYER_GENERATION_ENABLED: "false"
  BASE_URL: api-test.zskarte.ch

jobs:
  build-and-deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        name: Login to Docker Hub
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.FULL_IMAGE_NAME }}

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Replace and Apply Kubernetes Manifests
        uses: swdotcom/update-and-apply-kubernetes-configs@v1
        with:
          k8-config-file-paths: |
            .azure/k8s/namespace.yml
            .azure/k8s/server-envs.yml
            .azure/k8s/deployment.yml
            .azure/k8s/service.yml
            .azure/k8s/ingress.yml
          replacement-method: defined
        env:
          IMAGE_TAG: ${{ github.sha }}
          CHANGE_CAUSE: ${{ github.event.release.tag_name }}

      - name: Verify Server Deployment
        shell: bash
        run: |
          set -euo pipefail

          kubectl \
            --namespace "$KUBERNETES_NAMESPACE" \
            rollout status "deployment/$APP_NAME" \
            --timeout=240s

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 15 \
            "https://$BASE_URL/health" \
            --output /dev/null

  build-and-deploy-app:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      NODE_VERSION: '22.14.0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: 'upload'
          app_location: '/' # App source code path
          api_location: '' # Api source code path - optional
          app_build_command: 'npm run build:app:dev'
          output_location: 'packages/app/dist/zskarte/browser' # Built app content directory - optional
          config_file_location: 'packages/app/' # Config file path - optional
          ###### End of Repository/Build Configurations ######
