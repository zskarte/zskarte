apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  namespace: ${KUBERNETES_NAMESPACE}
  labels:
    app: ${APP_NAME}
    service: api
    stage: ${STAGE}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${APP_NAME}
      service: api
      stage: ${STAGE}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
        service: api
        stage: ${STAGE}
    spec:
      containers:
        - name: ${APP_NAME}
          image: ${FULL_IMAGE_NAME}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "1338"
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: db_host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: db_port
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: db_name
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: db_user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: db_password
            - name: DATABASE_SSL
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: db_ssl
            - name: RUN_MIGRATIONS_ON_BOOT
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: run_migrations_on_boot
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: better_auth_secret
            - name: BETTER_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: better_auth_url
            - name: TRUSTED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: trusted_origins
            - name: PROXY_ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: proxy_allowed_hosts
            - name: SIGN_KEY_TYPE
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: sign_key_type
            - name: SIGN_PRIVATE_KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: sign_private_key_passphrase
            - name: SKIP_EXTERNAL_IP
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: skip_external_ip
            - name: STORAGE_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: storage_provider
            - name: STORAGE_AZURE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: storage_azure_account
            - name: STORAGE_AZURE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: storage_azure_account_key
            - name: STORAGE_AZURE_CONTAINER_NAME
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: storage_azure_container_name
            - name: STORAGE_AZURE_SERVICE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: storage_azure_service_base_url
            - name: MAPLAYER_GENERATION_ENABLED
              valueFrom:
                secretKeyRef:
                  name: server-envs
                  key: maplayer_generation_enabled
          ports:
            - name: http
              containerPort: 1338
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 4Gi
