<div class="language-selector-container">
  <button
    [attr.aria-label]="i18n.get('language')"
    [matMenuTriggerFor]="languageMenu"
    class="language-button"
    mat-button
  >
    <mat-icon>language</mat-icon>
    <span class="language-text">{{ i18n.get(currentLocale()) }}</span>
  </button>
</div>

<mat-menu #languageMenu="matMenu">
  @for (locale of locales; track locale) {
    <button (click)="setLocale(locale)" [ngClass]="{ 'active-language': locale === currentLocale() }" mat-menu-item>
      @if (locale === currentLocale()) {
        <mat-icon>check</mat-icon>
      }
      <span [ngClass]="{ 'selected-text': locale === currentLocale() }">
        {{ i18n.get(locale) }}
      </span>
    </button>
  }
</mat-menu>
