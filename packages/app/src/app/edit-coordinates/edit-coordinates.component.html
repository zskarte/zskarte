<app-dialog-header>
  <h2>{{ i18n.get('defineCoordinates') }}</h2>
</app-dialog-header>

<app-dialog-body>
  <div class="format">
    <app-projection-selection
      (projectionChanged)="updateProjection($event)"
      [disabled]="formatedCoordinatesControl.invalid || formatedCoordinatesControl.pending"
      [numerical]="numerical"
      [projectionFormatIndex]="projectionFormatIndex"
    ></app-projection-selection>
  </div>
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ i18n.get('defineCoordinates') }}</mat-label>
    <textarea [formControl]="formatedCoordinatesControl" matInput></textarea>
    <mat-error>{{ error }}</mat-error>
  </mat-form-field>
</app-dialog-body>
<app-dialog-footer>
  <button (click)="cancel()" mat-stroked-button>{{ i18n.get('cancel') }}</button>
  <button
    (click)="ok()"
    [disabled]="formatedCoordinatesControl.invalid || formatedCoordinatesControl.pending"
    color="primary"
    mat-flat-button
  >
    {{ i18n.get('ok') }}
  </button>
</app-dialog-footer>
