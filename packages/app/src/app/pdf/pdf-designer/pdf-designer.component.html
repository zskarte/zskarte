<as-split direction="horizontal">
  <as-split-area [size]="60">
    <div #designer class="designer"></div>
  </as-split-area>
  <as-split-area [size]="40" class="details">
    <div class="header">
      <div class="title">{{ templateName() }}</div>
      <div class="buttons">
        <button (click)="help()" [attr.aria-label]="i18n.get('help')" [title]="i18n.get('help')" mat-icon-button>
          <mat-icon>help</mat-icon>
        </button>
        <button (click)="reset()" [attr.aria-label]="i18n.get('reset')" [title]="i18n.get('reset')" mat-icon-button>
          <mat-icon>refresh</mat-icon>
        </button>
        <button
          (click)="resetToDefault()"
          [attr.aria-label]="i18n.get('defaultValues')"
          [title]="i18n.get('defaultValues')"
          mat-icon-button
        >
          <mat-icon>restore</mat-icon>
        </button>
        <button
          (click)="download()"
          [attr.aria-label]="i18n.get('download')"
          [title]="i18n.get('download')"
          color="basic"
          mat-icon-button
        >
          <mat-icon>file_download</mat-icon>
        </button>
        <button
          (click)="saveTemplate()"
          [attr.aria-label]="i18n.get('save')"
          [title]="i18n.get('save')"
          color="basic"
          mat-icon-button
        >
          <mat-icon>save</mat-icon>
        </button>
        <button
          (click)="printEmptyTemplate()"
          [attr.aria-label]="i18n.get('printEmptySavedTemplate')"
          [attr.title]="i18n.get('printEmptySavedTemplate')"
          mat-icon-button
        >
          <mat-icon>print</mat-icon>
        </button>
        <button
          (click)="closeDesigner()"
          [attr.aria-label]="i18n.get('cancel')"
          [title]="i18n.get('cancel')"
          mat-icon-button
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
    <textarea #template [ngClass]="{ invalid: error() !== null }" class="template"></textarea>
    <div class="status">
      <div class="position">Zeile: {{ currentRow() }}, Spalte: {{ currentCol() }}</div>
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }
    </div>
  </as-split-area>
</as-split>
