@if (signs.length > 0) {
  <div>
    <h4 aria-level="2">{{ i18n.get('recentlyUsedSigns') }}</h4>
    <div class="wrapper">
      @for (sign of signs; track sign) {
        <button (click)="doSelectSign(sign)" [title]="i18n.getLabelForSign(sign)" color="primary" mat-button>
          <img [src]="getImageUrl(sign.src)" />
        </button>
      }
    </div>
  </div>
}
