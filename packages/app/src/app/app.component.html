@if (navigation.showLanguageSelector()) {
  <app-language-selector [class.onHelpPage]="navigation.isHelpPage()"></app-language-selector>
}
<main
  [class.help-page]="navigation.isHelpPage()"
  [class.journal-address-preview]="journalAddressPreview()"
  [style.height.px]="height"
>
  @if (operationId() && !navigation.isHelpPage()) {
    <nav [tabPanel]="tabPanel" class="main-tabs mat-elevation-z3" mat-tab-nav-bar>
      @for (link of navLinks; track link.link) {
        <a #rla="routerLinkActive" [active]="rla.isActive" [routerLink]="link.link" mat-tab-link routerLinkActive>
          {{ i18n.get(link.label) }}
        </a>
      }
    </nav>
    <app-sidebar-wrapper></app-sidebar-wrapper>
  }
  <mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</main>
