<app-dialog-header>
  <h2>{{ i18n.get('text') }}</h2>
</app-dialog-header>
<app-dialog-body>
  <mat-form-field appearance="outline">
    <textarea [(ngModel)]="text" matInput placeholder="{{ i18n.get('yourText') }}"></textarea>
  </mat-form-field>
</app-dialog-body>
<app-dialog-footer>
  <button (click)="cancel()" mat-stroked-button>
    {{ i18n.get('cancel') }}
  </button>
  <button (click)="submit()" color="primary" mat-flat-button>
    {{ i18n.get('ok') }}
  </button>
</app-dialog-footer>
