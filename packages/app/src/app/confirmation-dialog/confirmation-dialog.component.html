<app-dialog-header>
  <h2>{{ data.title ?? i18n.get('confirm') }}</h2>
</app-dialog-header>
<app-dialog-body>
  @if (data.html) {
    <div [innerHTML]="data.html" class="innerHtml"></div>
  } @else {
    <mat-card>
      {{ data.message }}
    </mat-card>
  }
</app-dialog-body>
<app-dialog-footer>
  <button [mat-dialog-close]="false" mat-stroked-button>{{ data.cancelLabel ?? i18n.get('cancel') }}</button>
  <button [mat-dialog-close]="true" cdkFocusInitial color="primary" mat-flat-button>
    {{ data.confirmLabel ?? i18n.get('confirm') }}
  </button>
</app-dialog-footer>
