<div #mapElement class="map" id="map"></div>
@if (renderer.observeMousePosition() | async; as mousePosition) {
  @if (renderer.observeTooltip() | async; as sketchSize) {
    <div
      [innerHTML]="sketchSize"
      [style.left.px]="mousePosition[0]"
      [style.top.px]="mousePosition[1]"
      class="tooltip noprint"
    ></div>
  }
}

<button #deleteButton (click)="remove()" class="edit-button" color="warn" mat-mini-fab>
  <i class="material-icons">delete_forever</i>
</button>
<button
  #rotateButton
  (mousedown)="startRotating()"
  (touchstart)="startRotating()"
  class="edit-button rotate-button"
  color="primary"
  mat-mini-fab
>
  <!-- todo maybe add click" -->
  <i class="material-icons">rotate_left</i>
</button>
<button #copyButton (click)="copy()" class="edit-button" color="primary" mat-mini-fab>
  <i class="material-icons">content_copy</i>
</button>

<button #drawButton (click)="toggleDrawingDialog()" class="edit-button" color="primary" mat-mini-fab>
  <mat-icon>stars</mat-icon>
</button>
<button #closeButton (click)="hidePositionFlag()" class="edit-button" mat-mini-fab>
  <mat-icon>close</mat-icon>
</button>
