<app-dialog-header>
  <h2>{{ i18n.get('enterYourName') }}</h2>
</app-dialog-header>

<form (submit)="submit($event)">
  <app-dialog-body>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ i18n.get('myName') }}</mat-label>
      <input [formControl]="nameControl" cdkFocusInitial matInput maxlength="40" />
    </mat-form-field>
  </app-dialog-body>

  <app-dialog-footer>
    <button (click)="cancel()" mat-stroked-button type="button">
      {{ i18n.get('cancel') }}
    </button>
    <button
      [disabled]="nameControl.invalid || !nameControl.value?.trim()"
      color="primary"
      mat-flat-button
      type="submit"
    >
      {{ i18n.get('ok') }}
    </button>
  </app-dialog-footer>
</form>
