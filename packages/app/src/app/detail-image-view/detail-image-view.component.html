<app-dialog-header>
  <h2>{{ i18n.get('symbol') }}</h2>
</app-dialog-header>
<app-dialog-body>
  <div class="title">{{ title }}</div>
  <img [alt]="title" [src]="imageSrc" />
</app-dialog-body>
<app-dialog-footer>
  <button color="primary" mat-dialog-close mat-flat-button>
    {{ i18n.get('ok') }}
  </button>
</app-dialog-footer>
