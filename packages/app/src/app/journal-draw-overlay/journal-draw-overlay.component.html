@if (entry()) {
  <div [ngClass]="{ expanded: expanded() }" class="journal-infos mat-elevation-z3">
    <div class="journal-header-content">
      <span class="message-id">#{{ entry()!.messageNumber }}</span>
      <span class="subject">{{ entry()!.messageSubject }}</span>
      <button (click)="toggleExpanded()" class="expand" mat-icon-button>
        <mat-icon>{{ expanded() ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
    </div>
    <p
      (click)="search.handleMessageContentClick($event)"
      [innerHTML]="entry()!.messageContent | replaceAllAddressTokens: true"
      class="preserve-linebreak"
    ></p>

    <div class="buttons">
      <button (click)="close(false)" mat-flat-button>{{ i18n.get('cancel') }}</button>
      <button (click)="close(true)" color="primary" mat-flat-button>
        {{ i18n.get('markAsDrawn') }}
      </button>
    </div>
  </div>
}
