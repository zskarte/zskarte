<button
  (click)="resetRotation()"
  [attr.aria-label]="i18n.get('resetRotation')"
  class="compass-button mat-elevation-z3"
  mat-icon-button
>
  <div [style.transform]="'rotate(' + (rotation$ | async) + 'rad)'" class="compass-icon">
    <svg height="24" viewBox="0 0 24 24" width="24">
      <polygon fill="#EA4335" points="12,2 15,12 12,10 9,12" />
      <polygon fill="#BDBDBD" points="12,22 9,12 12,14 15,12" />
    </svg>
  </div>
</button>
