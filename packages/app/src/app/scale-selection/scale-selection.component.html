<app-dialog-header>
  <h2>{{ i18n.get('scale') }}</h2>
</app-dialog-header>
<app-dialog-body class="content">
  <mat-card>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ i18n.get('scaleToUse') }}</mat-label>
      <input [(ngModel)]="scale" cdkFocusInitial matInput name="scale" type="text" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>screenDimension (in ")</mat-label>
      <input (change)="updateDpi()" [(ngModel)]="screenDimension" matInput name="screenDimension" type="text" />
    </mat-form-field>
  </mat-card>

  <mat-card>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>screenWidth (in px)</mat-label>
      <input [(ngModel)]="screenWidth" disabled matInput name="screenWidth" type="text" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>screenHeight (in px)</mat-label>
      <input [(ngModel)]="screenHeight" disabled matInput name="screenHeight" type="text" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>devicePixelRatio</mat-label>
      <input [(ngModel)]="devicePixelRatio" disabled matInput name="devicePixelRatio" type="text" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>DPI</mat-label>
      <input [(ngModel)]="dpi" disabled matInput name="dpi" type="text" />
    </mat-form-field>
  </mat-card>
</app-dialog-body>

<app-dialog-footer>
  <div align="end" class="buttons" mat-dialog-actions>
    <button (click)="cancel()" mat-stroked-button>{{ i18n.get('cancel') }}</button>
    <button (click)="ok()" color="primary" mat-flat-button>{{ i18n.get('ok') }}</button>
  </div>
</app-dialog-footer>
