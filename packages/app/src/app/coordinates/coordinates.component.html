<div [ngClass]="{ showOptions: showOptions }" class="coordinates mat-elevation-z3">
  @if (showOptions) {
    <app-projection-selection
      (projectionChanged)="updateProjection($event)"
      [multiple]="true"
      [projectionFormatIndexes]="projectionFormatIndexes()"
      [showNumerical]="false"
    ></app-projection-selection>
  }
  <div class="box">
    <div class="coords">
      @for (coordinate of mappedCoordinates(); track coordinate.type) {
        <span>
          {{ coordinate.coordinate }}
        </span>
      }
    </div>

    <button (click)="toggleOptions()" class="switch" mat-icon-button>
      <mat-icon>{{ showOptions ? 'save' : 'settings' }}</mat-icon>
    </button>
  </div>
</div>
