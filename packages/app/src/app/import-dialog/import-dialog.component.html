<app-dialog-header>
  <h2>{{ i18n.get('import') }}</h2>
</app-dialog-header>
<app-dialog-body>
  <input #fileInput accept=".zsjson" id="loadFromFile" type="file" />
</app-dialog-body>
<app-dialog-footer>
  <button (click)="onNoClick()" mat-button>
    {{ i18n.get('cancel') }}
  </button>
  <button (click)="readFromFile()" color="primary" mat-flat-button>
    {{ i18n.get('import') }}
  </button>
</app-dialog-footer>
